name: Publish latest UI to Pages

on:
  push:
    branches: [main]
    paths:
      - '03_Outputs/01_UI畫面設計/00_最新版/DS總控台畫面設計/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify latest demo
        working-directory: '03_Outputs/01_UI畫面設計/00_最新版/DS總控台畫面設計'
        run: |
          npm run build
          npm run check
      - name: Package website files only
        env:
          DEMO: '03_Outputs/01_UI畫面設計/00_最新版/DS總控台畫面設計'
        run: |
          mkdir -p _site/src
          cp "$DEMO/index.html" _site/index.html
          cp "$DEMO/src/styles.css" _site/src/styles.css
          cp "$DEMO/src/app.bundle.js" _site/src/app.bundle.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
